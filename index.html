<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Мои задачи</title>
        <link rel="stylesheet" href="style.css" />
        <script src="script.js" defer></script>
    </head>
    <body>
        <main class="app">
            <h1 class="app__title">Мои задачи</h1>

            <form class="app__form" id="todo-form">
                <input
                    type="text"
                    class="app__input"
                    id="todo-input"
                    placeholder="Что нужно сделать?"
                    autocomplete="off"
                    required />
                <button type="submit" class="app__add-btn">Добавить</button>
            </form>

            <ul class="app__list" id="todo-list">
                <li class="todo" data-id="1">
                    <input type="checkbox" class="todo__checkbox" />
                    <span class="todo__text">Сделать лабораторную</span>
                    <button
                        type="button"
                        class="todo__delete"
                        aria-label="Удалить задачу">
                        ✕
                    </button>
                </li>
            </ul>

            <p class="app__empty" id="empty-state">
                Список пуст. Добавьте первую задачу 👆
            </p>

            <footer class="app__footer">
                <span class="app__counter" id="counter">
                    Всего: 0 | Выполнено: 0
                </span>
                <button class="app__clear-btn" id="clear-btn" type="button">
                    Очистить всё
                </button>
            </footer>
        </main>

    </body>
</html>
